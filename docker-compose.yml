services:
    postgres:
        image: postgres:16-alpine
        container_name: p172-postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: p172
        ports:
            - "5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d p172"]
            interval: 5s
            timeout: 5s
            retries: 10
